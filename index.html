<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Report</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .accent {
            color: #38bdf8;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .badge {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            border: 1px solid #38bdf8;
            border-radius: 999px;
            color: #38bdf8;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        footer {
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="badge">Under Construction</div>

        <h1>Skyline <span class="accent">Report</span></h1>

        <p>
            Independent reporting, analysis, and public records research.
            The site is currently being built and will be launching soon.
        </p>

        <footer>
            © 2026 Skyline Report
        </footer>
    </main>
</body>
</html>
